<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Platform Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Панель управления IoT-платформой</h1>

    <div class="card">
        <h2>Отправить данные с датчика</h2>
        <div class="input-group">
            <input type="text" id="deviceId" placeholder="ID датчика (например, sensor1)" value="sensor1">
            <input type="number" id="temperature" placeholder="Температура" value="25.5" step="0.1">
            <button onclick="sendData()">Отправить</button>
        </div>
        <p id="status"></p>
    </div>

    <div class="card">
        <h2>Последние показания</h2>
        <button onclick="loadData()">Обновить данные</button>
        <table id="dataTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Датчик</th>
                <th>Температура</th>
                <th>Время</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
